# The Rust setup the ci jobs share: system packages, the stable toolchain
# with clippy, and a cache of built dependencies.
name: rust-setup
description: Install the Rust toolchain and restore the build cache
inputs:
  targets:
    description: Extra compile targets to install
    required: false
    default: ""
runs:
  using: composite
  steps:
    # ALSA for audio; the system media framework's headers for video,
    # and its base decoders for the video tests' Ogg file.
    - name: ALSA and media framework headers (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base
    # The ASIO bindings are generated with bindgen, which needs libclang;
    # the Windows runner ships LLVM. The build downloads the ASIO SDK.
    - name: libclang for bindgen
      if: runner.os == 'Windows'
      shell: bash
      run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
    - name: Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal -c clippy
        rustup default stable
        if [ -n "${{ inputs.targets }}" ]; then rustup target add ${{ inputs.targets }}; fi
    # Built dependencies are cached per job and platform. Only main saves
    # the cache, so many open pull requests don't push main's cache out
    # of the repository's cache space; pull requests read main's.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
