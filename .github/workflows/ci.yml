# Product CI (ROADMAP 0.2): build, format, lints, tests and the dependency
# licence check on Windows, macOS and Linux.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI builds: smaller caches and faster compiling and
  # linking. Panics still say which file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Pull requests that only touch docs skip the build and licence jobs.
  # Skipped jobs count as passed, so a docs-only PR can still merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if echo "$files" | grep -qvE '^docs/|\.md$|^LICENSE$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping build and licence checks."
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # Format is quick and needs no build, so it gets its own job.
  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt
          rustup default stable
      - run: cargo fmt --all --check

  # Lints run beside the tests rather than before them, so the slowest
  # platform takes the longer of the two, not both added together.
  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Builds and tests on each platform. The job keeps the name "build" so
  # its checks keep the names branch protection may require.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      # nextest runs every test binary side by side instead of one after
      # another; doc tests are run separately as nextest skips them.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --no-fail-fast
      - run: cargo test --workspace --doc
      # A golden-render test that fails writes what it rendered here
      # (crates/engine/tests/golden.rs), to compare by ear.
      - name: Upload failed golden renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-renders-${{ matrix.os }}
          path: target/tmp/golden
          if-no-files-found: ignore

  # A Windows build of the app for trying on the owner's PC
  # (docs/review-queue/). Built on main and when run by hand, not on
  # every pull request: it was the slowest step of the slowest job.
  windows-app:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - run: cargo build --release -p daw-app
      - name: Upload the Windows app
        uses: actions/upload-artifact@v4
        with:
          name: daw-windows-x64
          path: target/release/daw.exe
          if-no-files-found: error

  # macos-latest is Apple Silicon; also make sure Intel Macs build. On
  # main and when run by hand only, like the Windows app.
  macos-intel:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          targets: x86_64-apple-darwin
      - run: cargo build --workspace --target x86_64-apple-darwin

  # The phone remote's Android app (android/README.md): the shared
  # core's tests, then a debug package to sideload on the owner's phone
  # (docs/review-queue/2.2-phone-remote.md), on main only.
  android:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        working-directory: android
        run: ./gradlew --no-daemon test
      # The app package is built on main and when run by hand only, like
      # the Windows app: pull requests build no app for any platform.
      - name: The app package
        if: github.event_name != 'pull_request'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload the Android app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: daw-remote-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  licences:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      # The spikes are a separate workspace; hold them to the same policy.
      - run: cp deny.toml spikes/deny.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: spikes/Cargo.toml
          command: check licenses bans sources

  # Contributions carry a DCO sign-off (CONTRIBUTING.md). Checked on pull
  # requests only.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        shell: bash
        run: |
          missing=0
          for c in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $c has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
