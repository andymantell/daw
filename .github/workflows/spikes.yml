# Builds and tests the Phase 0 spikes (ROADMAP 0.1) on Windows and Linux.
# The Windows job uploads the prototypes as a downloadable artifact.
name: spikes

on:
  push:
    branches: [main]
    paths: ["spikes/**", ".github/workflows/spikes.yml"]
  pull_request:
    paths: ["spikes/**", ".github/workflows/spikes.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: spikes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ALSA headers (Linux audio backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # The ASIO bindings are generated with bindgen, which needs libclang;
      # the Windows runner ships LLVM. The build downloads the ASIO SDK.
      - name: libclang for bindgen
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Upload Windows prototypes
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: spikes-windows-x64
          path: |
            spikes/target/release/vst3-scan.exe
            spikes/target/release/audio-io.exe
            spikes/target/release/plugin-host.exe
            spikes/target/release/ui-timeline.exe
            spikes/target/release/stretch-bench.exe
          if-no-files-found: error
      # Spike 0.6: measure the speed and pitch candidates and keep the
      # rendered audio for listening tests.
      - name: Speed and pitch benchmark
        if: runner.os == 'Linux'
        run: cargo run --release -p stretch-bench -- --seconds 5
      - name: Upload speed and pitch results
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: stretch-listening
          path: |
            spikes/stretch-report.txt
            spikes/stretch-listen/
          if-no-files-found: error
