[package]
name = "daw-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "daw"
path = "src/main.rs"

[dependencies]
daw-audio-io = { path = "../audio-io" }
daw-collab = { path = "../collab" }
daw-effects = { path = "../effects" }
daw-engine = { path = "../engine" }
daw-instruments = { path = "../instruments" }
daw-notation = { path = "../notation" }
daw-plugins = { path = "../plugins" }
daw-project = { path = "../project" }
daw-remote = { path = "../remote" }
daw-video = { path = "../video" }
eframe = "0.37.0"
hound = "3.5.1"
minisign-verify = "0.3.0"
rfd = "0.17.2"
serde_json = "1.0.154"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
vst3 = "0.3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[dev-dependencies]
daw-test-plugin = { path = "../test-plugin" }
egui_kittest = { version = "0.37.0", features = ["eframe"] }
