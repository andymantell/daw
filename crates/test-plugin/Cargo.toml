[package]
name = "daw-test-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A tiny VST 3 effect (and test instrument) for the plugin host's automated
# tests: stereo gain with one automatable parameter, a fixed reported
# latency and saved state. The same library is a CLAP test effect too.
# Never shipped.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap-sys = "0.5.0"
vst3 = "0.3.0"

# Misbehaving builds, for testing how the host copes with broken plugins.
# Each is built on its own by the plugin host's tests.
[features]
# Aborts the process when the host asks for the factory.
crash-on-load = []
# Never returns from asking for the factory.
hang-on-load = []
# The effect refuses every processing setup.
refuse-setup = []
# Aborts the process on its first block of audio.
crash-on-process = []
# Never returns from its first block of audio.
hang-on-process = []
