# Dependency policy checked in CI by cargo-deny (ROADMAP 0.2).
# Every dependency must be compatible with GPL-3.0-or-later
# (docs/decisions/0001-project-licence.md, docs/CLEAN_ROOM.md §5).

[graph]
all-features = true

[licenses]
# GPLv3-compatible licences. GPL-2.0-only is deliberately absent: it is
# not compatible with GPLv3.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list covers future dependencies too.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
