# Dependency policy checked in CI by cargo-deny (ROADMAP 0.2).
# Every dependency must be compatible with GPL-3.0-or-later
# (docs/decisions/0001-project-licence.md, docs/CLEAN_ROOM.md §5).

[graph]
all-features = true

[licenses]
# GPLv3-compatible licences. GPL-2.0-only is deliberately absent: it is
# not compatible with GPLv3.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list covers future dependencies too.
unused-allowed-license = "allow"

# Fonts bundled by the first UI toolkit tried in spike 0.1 C. Fonts are
# data under their own font licences, not code linked into ours. Allowed
# for this one crate only, pending the UI toolkit decision
# (docs/decisions/0007-ui-toolkit.md), which must confirm the product can
# ship them or swap in fonts under licences we have checked.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# The second UI toolkit tried in spike 0.1 C offers GPL-3.0-only (or its
# own licences, which we do not use). GPL-3.0-only code can be combined
# with our GPL-3.0-or-later code, but the combined program could then only
# be distributed under GPLv3, not a later version. Allowed for these crates
# only, pending the UI toolkit decision (docs/decisions/0007-ui-toolkit.md).
[[licenses.exceptions]]
crate = "i-slint-backend-selector"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "i-slint-backend-winit"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "i-slint-common"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "i-slint-compiler"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "i-slint-core"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "i-slint-core-macros"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "i-slint-renderer-femtovg"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "i-slint-renderer-skia"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "i-slint-renderer-software"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "slint"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "slint-build"
allow = ["GPL-3.0-only"]
[[licenses.exceptions]]
crate = "slint-macros"
allow = ["GPL-3.0-only"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
