# Dependency policy checked in CI by cargo-deny (ROADMAP 0.2).
# Every dependency must be compatible with GPL-3.0-or-later
# (docs/decisions/0001-project-licence.md, docs/CLEAN_ROOM.md §5).

[graph]
all-features = true
# Only the platforms we build for. Without this, dependencies used only on
# other platforms (web, phones) are checked too, such as a certificate
# list that a TLS crate needs only on the web.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
# GPLv3-compatible licences. GPL-2.0-only is deliberately absent: it is
# not compatible with GPLv3.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list covers future dependencies too.
unused-allowed-license = "allow"

# Fonts bundled by egui, the chosen UI toolkit (decision 0007). Fonts are
# data under their own font licences, not code linked into ours. Allowed
# for this one crate only, until the owner confirms the product can ship
# them or we swap in fonts under licences we have checked.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
