[package]
name = "vst3-test-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A tiny VST 3 effect for automated plugin-host tests: stereo gain with one
# automatable parameter, a fixed reported latency and saved state.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vst3 = "0.3.0"
